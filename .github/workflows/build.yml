name: Build desktop apps

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: windows-latest
            script: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No oauth-config.json here; extraResources tolerates its absence and
      # the app reports OAUTH_NOT_CONFIGURED instead of failing to build.
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: flora-ai-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error
