name: flora_ai
description: A premium, cross-platform mobile app called "Flora AI" using Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.4.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # AI Integration
  google_generative_ai: ^0.2.0
  
  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  
  # Google Sign-In & Drive Sync
  google_sign_in: ^6.1.5
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  
  # Monetization (Paywall)
  purchases_flutter: ^6.14.0 # RevenueCat
  
  # UI & Styling
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0
  animations: ^2.0.7
  fl_chart: ^0.65.0 # For scan history charts

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
